<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Launch Film</title>
<style>
  :root {
    --bg: #08070A; --bg-mid: #18171A; --win: #1C1B1F; --text: #FFFFFF;
    --muted: #9F9EA1; --faint: #5B5A5E; --hair: #2A292D;
    /* Set from product/product.json at load: --accent, --display, --ui. */
    --accent: #8B5CF6; --display: serif; --ui: sans-serif;
  }
  html, body { margin: 0; background: var(--bg); overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); transform-origin: 0 0; font-family: var(--ui); color: var(--text); }
  .abs { position: absolute; left: 0; top: 0; }
  #light { position: absolute; inset: 0; background: radial-gradient(ellipse 62% 70% at 50% 50%, var(--bg-mid) 0%, var(--bg) 100%); }
  #spot { position: absolute; inset: 0; background: radial-gradient(ellipse 95% 110% at 50% 48%, rgba(30,29,33,0.9) 0%, rgba(30,29,33,0.55) 30%, rgba(30,29,33,0.22) 60%, rgba(30,29,33,0) 100%); opacity: 0; }
  #backdrop { position: absolute; left: -96px; top: -54px; width: 2112px; height: 1188px; }
  #cam { position: absolute; inset: 0; perspective: 1800px; perspective-origin: 960px 540px; }
  #rig { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #rig > * { position: absolute; }
  #pcam { position: absolute; inset: 0; perspective: 1800px; perspective-origin: 960px 540px; }
  .panel { position: absolute; border-radius: 12px; box-shadow: 0 50px 120px rgba(0,0,0,.7), 0 0 0 1px var(--hair); }
  /* Window chrome: flat bar, title left, line controls right, 6px corners (not a Mac window). */
  .win { position: absolute; overflow: hidden; background: var(--win); box-shadow: 0 34px 90px rgba(0,0,0,.65), 0 0 0 1px var(--hair); }
  .tb { position: absolute; left: 0; top: 0; right: 0; height: 40px; overflow: hidden; box-shadow: inset 0 -1px 0 var(--hair); }
  .tb .title { position: absolute; left: 16px; top: 0; font: 600 14px/40px var(--ui); color: var(--muted); white-space: nowrap; }
  .tb .title .dim { color: var(--faint); }
  .tb svg { position: absolute; right: 16px; top: 14px; }
  .inner { position: absolute; overflow: hidden; }
  .inner canvas { display: block; width: 100%; height: 100%; }
  #hud { position: absolute; inset: 0; }
  .mask { position: absolute; overflow: hidden; }
  .eyebrow { font: 500 17px var(--ui); letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .eyebrow b { color: var(--text); font-weight: 500; }
  .name { font: 100px/1 var(--display); white-space: nowrap; }
  .row { font: 500 21px var(--ui); color: var(--muted); white-space: nowrap; }
  .row .v { color: var(--text); }
  .plat { position: absolute; color: #fff; }
  .av { position: absolute; border-radius: 50%; background: var(--logo) center/cover; }
  .dim { color: var(--muted); }
  #cursor { position: absolute; left: 0; top: 0; width: 46px; height: 46px; filter: drop-shadow(0 4px 8px rgba(0,0,0,.5)); transform-origin: 8px 4px; }
  #grain { position: absolute; inset: 0; mix-blend-mode: screen; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="light"></div>
  <div id="spot"></div>
  <img id="backdrop" src="build/studio/nopage_blur.jpg" alt="">
  <div id="cam"><div id="rig">
    <img id="studio" src="build/studio/nopage.png" style="border-radius:10px;box-shadow:0 60px 140px rgba(0,0,0,.7)" alt="">
    <div id="page"></div>
    <img id="studioBlur" src="build/studio/nopage_blur.jpg" alt="">
    <div id="studioDim" style="background:var(--bg)"></div>
    <div id="clickHi" style="border-radius:9px;box-sizing:border-box"></div>
    <div id="dockMark" style="width:4px;height:4px"></div>
  </div></div>
  <div id="pcam"></div>
  <div id="posts"></div>
  <div id="box" class="win">
    <div class="tb"><span class="title"></span></div>
    <div class="inner"><canvas id="face"></canvas></div>
  </div>
  <div id="ttui" class="abs"></div>
  <img id="exportBtn" class="abs" style="border-radius:12px" alt="">
  <div id="hud"></div>
  <svg id="cursor" viewBox="0 0 24 24"><path d="M4 2l15 11-7 1 4 8-3 1-4-8-5 5z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg>
  <canvas id="grain" width="1920" height="1080"></canvas>
</div>
<script src="lib/motion.js"></script>
<script src="film.js"></script>
</body>
</html>
